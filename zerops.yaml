zerops:
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/api && npm install
      deployFiles:
        - apps/api/~
        - db/~
      cache:
        - apps/api/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3001
          httpSupport: true
      start: node apps/api/src/index.js
      envSecrets:
        GROQ_API_KEY: <set in Zerops UI>
        ZEROPS_API_TOKEN: <set in Zerops UI>
        ZEROPS_PROJECT_ID: <set in Zerops UI>
        GITHUB_TOKEN: <optional, set in Zerops UI for higher API rate limits>
      env:
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:5432/${db_dbName}
        PORT: 3001
        FRONTEND_ORIGIN: https://frontend.zerops.app

  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/frontend && npm install && npm run build
      deployFiles: apps/frontend/~
      cache:
        - apps/frontend/node_modules
        - apps/frontend/.next/cache
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: cd apps/frontend && npm run start
      env:
        NEXT_PUBLIC_API_URL: https://api.zerops.app

  - setup: db
    run:
      base: postgresql@16
