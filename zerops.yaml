zerops:
  - setup: api
    build:
      base: nodejs@22
      # Installed from the repo root (not `cd apps/api`) so the resulting
      # node_modules is an ancestor of BOTH apps/api/src/*.js and
      # db/migrate.js|seed.js — the latter live outside apps/api/, so a
      # scoped `cd apps/api && npm install` would leave them unable to
      # resolve `pg` at runtime.
      buildCommands:
        - npm install
      # No trailing "/~" — that flattens a directory's contents into the
      # deploy root instead of preserving its path (confirmed live: it broke
      # `node apps/api/src/index.js` / `db/migrate.js` with MODULE_NOT_FOUND).
      # Plain paths preserve the tree, matching the relative paths our start
      # command and require()s expect.
      deployFiles:
        - package.json
        - package-lock.json
        - node_modules
        - apps/api
        - db
      cache:
        - node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3001
          httpSupport: true
      # apps/api/src/index.js runs migrate+seed in-process before listening —
      # NOT chained here with `&&` (confirmed live: Zerops's supervisor
      # didn't reliably continue past the first chained command, so
      # db:seed/the server were never reached).
      start: node apps/api/src/index.js
      # Names deliberately avoid the ZEROPS_ prefix — the Zerops dashboard
      # rejects user-defined env vars starting with it (confirmed live).
      envSecrets:
        GROQ_API_KEY: <set in Zerops UI>
        API_TOKEN: <set in Zerops UI — your personal Zerops API token, not a service secret>
        # These identify the PATIENT app's project/service (a separate
        # Zerops project — see apps/patient-app), not this api service.
        PATIENT_PROJECT_ID: <set in Zerops UI>
        PATIENT_SERVICE_ID: <set in Zerops UI>
        GITHUB_TOKEN: <optional, set in Zerops UI for higher API rate limits>
        # Both ${db_user}/${db_password}/${db_hostname}/${db_dbName} and
        # ${db_connectionString} left this completely unset at runtime
        # (confirmed live: "DATABASE_URL is not set.") despite matching
        # Zerops's own documented reference syntax — set the real, resolved
        # value directly in the api service's Environment Variables UI
        # instead (same as every other secret here). Never put the actual
        # value here — this file is in a public repo.
        DATABASE_URL: <set in Zerops UI — paste db service's "connection string, with values" here>
      env:
        PORT: 3001
        # Left unset deliberately — the frontend's exact Zerops domain isn't
        # known until first deploy, and CORS is an exact-string match (a
        # trailing slash or wrong path silently breaks every request, as we
        # found on Render). Defaults to permissive (*) until set precisely.
        # FRONTEND_ORIGIN: https://<actual-frontend-domain>.zerops.app

  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/frontend && npm install && npm run build
      # No trailing "/~" — see the api service's deployFiles comment above.
      # Just the parent path — listing apps/frontend/node_modules as its
      # own entry (nested under an already-listed parent) failed validation
      # live ("Files/folders listed in build.deployFiles do not exist"),
      # unlike the api service where node_modules was a sibling, not nested.
      deployFiles: apps/frontend
      # No .next/cache here (confirmed live): caching it made Zerops
      # pre-create the .next/ directory before the build ran, and next
      # build then failed immediately with EACCES writing .next/trace —
      # a permissions mismatch between however the cache path gets set up
      # and the user the build actually runs as. Letting next build create
      # .next/ itself avoids it; costs some rebuild speed, not correctness.
      cache:
        - apps/frontend/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      # No `cd`, and not `npm run start` either — confirmed live that Zerops
      # execs `start:` directly without a shell ("cd: not found"), and
      # `npm --prefix apps/frontend run start` got past that but then hit
      # "sh: next: not found" (npm's own PATH handling for --prefix is a
      # known trouble spot). Invoking next's actual entry script directly
      # sidesteps both PATH and npm's script-runner entirely. The directory
      # is passed positionally (`next start [directory]`) since Zerops execs
      # this from the deploy root, not apps/frontend, and next start looks
      # for .next/ relative to cwd (or that argument) by default — verified
      # locally running from repo root exactly as Zerops would.
      start: node apps/frontend/node_modules/next/dist/bin/next start apps/frontend -p 3000
      # No NEXT_PUBLIC_API_URL here: apps/frontend/lib/api.js hardcodes the
      # API base directly (a stale/wrong env var here repeatedly caused
      # silent 404s on Vercel — see that file's comment). Deploy the api
      # service first, note its real Zerops domain, hardcode it into
      # lib/api.js, then deploy this service.

  - setup: db
    run:
      base: postgresql@16
