zerops:
  - setup: api
    build:
      base: nodejs@22
      # Installed from the repo root (not `cd apps/api`) so the resulting
      # node_modules is an ancestor of BOTH apps/api/src/*.js and
      # db/migrate.js|seed.js — the latter live outside apps/api/, so a
      # scoped `cd apps/api && npm install` would leave them unable to
      # resolve `pg` at runtime.
      buildCommands:
        - npm install
      # No trailing "/~" — that flattens a directory's contents into the
      # deploy root instead of preserving its path (confirmed live: it broke
      # `node apps/api/src/index.js` / `db/migrate.js` with MODULE_NOT_FOUND).
      # Plain paths preserve the tree, matching the relative paths our start
      # command and require()s expect.
      deployFiles:
        - package.json
        - package-lock.json
        - node_modules
        - apps/api
        - db
      cache:
        - node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3001
          httpSupport: true
      # Runs the (idempotent) schema + seed on every deploy, same fix that
      # unblocked the Render deployment — no manual migration step ever.
      start: npm run db:migrate && npm run db:seed && node apps/api/src/index.js
      envSecrets:
        GROQ_API_KEY: <set in Zerops UI>
        ZEROPS_API_TOKEN: <set in Zerops UI — personal API token, not a service secret>
        # These identify the PATIENT app's project/service (a separate
        # Zerops project — see apps/patient-app), not this api service.
        ZEROPS_PROJECT_ID: <set in Zerops UI>
        ZEROPS_SERVICE_ID: <set in Zerops UI>
        GITHUB_TOKEN: <optional, set in Zerops UI for higher API rate limits>
      env:
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:5432/${db_dbName}
        PORT: 3001
        # Left unset deliberately — the frontend's exact Zerops domain isn't
        # known until first deploy, and CORS is an exact-string match (a
        # trailing slash or wrong path silently breaks every request, as we
        # found on Render). Defaults to permissive (*) until set precisely.
        # FRONTEND_ORIGIN: https://<actual-frontend-domain>.zerops.app

  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/frontend && npm install && npm run build
      # No trailing "/~" — see the api service's deployFiles comment above.
      deployFiles: apps/frontend
      cache:
        - apps/frontend/node_modules
        - apps/frontend/.next/cache
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: cd apps/frontend && npm run start
      # No NEXT_PUBLIC_API_URL here: apps/frontend/lib/api.js hardcodes the
      # API base directly (a stale/wrong env var here repeatedly caused
      # silent 404s on Vercel — see that file's comment). Deploy the api
      # service first, note its real Zerops domain, hardcode it into
      # lib/api.js, then deploy this service.

  - setup: db
    run:
      base: postgresql@16
